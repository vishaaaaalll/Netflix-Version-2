    <script>
      // Apply the saved theme before first paint to avoid a flash of the wrong theme.
      (function () {
        var colors = { rose: '#faf5ef', lavender: '#f7f3fc', sage: '#f5f7f0', ocean: '#0e1622', cocoa: '#171114' };
        try {
          var stored = localStorage.getItem('ournetflix-theme') || 'rose';
          // Migrate old values: light -> rose, dark/system-dark -> cocoa.
          if (stored === 'light') stored = 'rose';
          else if (stored === 'dark') stored = 'cocoa';
          else if (stored === 'system')
            stored = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'cocoa' : 'rose';
          if (!colors[stored]) stored = 'rose';
          var root = document.documentElement;
          root.classList.add('theme-' + stored);
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', colors[stored]);
        } catch (e) {
          document.documentElement.classList.add('theme-rose');
        }
      })();
    </script>
